[project]
name = "find-anomali"
version = "0.1.0"
description = "CLI deteksi anomali pemakaian air pra-cetak tagihan PDAM"
requires-python = ">=3.12"
dependencies = [
    "mysql-connector-python>=9.0",
    "pandas>=2.2",
    "python-dotenv>=1.0",
]

[project.scripts]
find-anomali = "anomali.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anomali"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
